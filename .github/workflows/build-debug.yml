name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.4.1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Record job start time
        run: date +%s > /tmp/uh_start.txt

      - uses: actions/checkout@v4
        name: Checkout

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK packages
        timeout-minutes: 6
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Restore Godot binary cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          wget --show-progress --tries=3 --timeout=30 --waitretry=5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Restore export templates cache
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download and install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          wget --show-progress --tries=3 --timeout=30 --waitretry=5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Installed templates:"
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import / validate Godot project
        timeout-minutes: 3
        run: ./godot --headless --editor --quit

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install gdb + strace
        run: sudo apt-get install -y gdb strace >/dev/null 2>&1 || true

      - name: Export real Android Debug APK (gdb diagnostic)
        timeout-minutes: 6
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          echo "=== binary symbol check ==="
          nm ./godot 2>&1 | head -3 || echo "no symtab"
          file ./godot 2>/dev/null || true
          mkdir -p build
          ./godot --headless --verbose --export-android "Android" "build/unknown-haveli-debug.apk" > /tmp/export.log 2>&1 &
          BGPID=$!
          sleep 40
          GP=$(pgrep -x godot | head -1)
          echo "BGPID=$BGPID GODOT_PID=$GP"
          if [ -n "$GP" ]; then
            echo "--- ps ---"
            ps -o pid,stat,etime,wchan:26,comm -p $GP
            echo "--- strace 5s (blocked on?) ---"
            sudo sysctl kernel.yama.ptrace_scope=0 2>/dev/null || true
            timeout 8 sudo strace -p $GP -f -e trace=futex,read,write,poll,wait4,clone,execve,openat -c 2>&1 | tail -30
            echo "--- gdb thread backtrace ---"
            timeout 30 sudo gdb -batch -p $GP -ex "set pagination off" -ex "thread apply all bt" 2>&1 | grep -vE "^\s*$|warning: (File|some) |Missing separate debuginfo|Debuginfod|Please report|Reading symbols|Downloading|ptrace: Operation" | head -200
          else
            echo "godot process not running (exited or crashed)"
          fi
          echo "--- addr2line of observed frames ---"
          addr2line -f -C -e ./godot 0x41e7b2 0x51525d 0x42a9718 0x4c28b9a 0x14787a6 0x42a98e5 0x500ada3 0x9f7bd8 0x4c470d 0x4c3467 0x3b7f65e 2>&1 | head -30 || true
          echo "--- export log tail ---"
          tail -35 /tmp/export.log
          kill -9 $BGPID 2>/dev/null
          pkill -9 -f "export-android" 2>/dev/null
          sleep 1
          exit 1

      - name: Export via godot-ci container (barichello 4.4)
        timeout-minutes: 10
        run: |
          docker run --rm \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            barichello/godot-ci:4.4 \
            bash -lc "mkdir -p build && timeout 150 godot --headless --verbose --export-android 'Android' 'build/unknown-haveli-debug.apk' && ls -la build/"

      - name: Assert real APK exists
        run: |
          test -f build/unknown-haveli-debug.apk && echo "APK OK: $(ls -lh build/unknown-haveli-debug.apk | awk '{print $5}')" || { echo "FAIL: no APK produced"; exit 1; }

      - name: Print job timing summary
        run: |
          end=$(date +%s)
          start=$(cat /tmp/uh_start.txt)
          echo "Total job elapsed: $(( end - start )) seconds"
          echo "Per-step durations (Took X s) are shown next to each step in this log."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unknown-haveli-debug-apk
          path: build/unknown-haveli-debug.apk