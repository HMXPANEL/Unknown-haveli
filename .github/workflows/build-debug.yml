name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.4.1"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Record job start time
        run: date +%s > /tmp/uh_start.txt

      - uses: actions/checkout@v4
        name: Checkout

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android SDK packages
        timeout-minutes: 6
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Restore Godot binary cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          wget --show-progress --tries=3 --timeout=30 --waitretry=5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Restore export templates cache
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download and install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          wget --show-progress --tries=3 --timeout=30 --waitretry=5 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Installed templates:"
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import / validate Godot project
        timeout-minutes: 3
        run: ./godot --headless --editor --quit

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export real Android Debug APK (diagnostic)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          echo "--- editor settings: android keys ---"
          grep -i "sdk\|keystore\|android" ~/.config/godot/editor_settings-*.tres 2>/dev/null || echo "NO android keys in editor settings"
          echo "--- preset keystore keys ---"
          grep -i "keystore" export_presets.cfg || echo "NO keystore keys in preset"
          mkdir -p build
          timeout 60 ./godot --headless --verbose --export-android "Android" "build/unknown-haveli-debug.apk" 2>&1 &
          BG=$!
          sleep 40
          echo "--- all relevant processes ---"
          ps -eo pid,ppid,stat,etime,wchan:28,comm | grep -iE "godot|aapt|zipalign|apksigner|keytool|timeout" | grep -v grep || echo "NONE running"
          echo "--- build dir ---"
          ls -la build/ 2>/dev/null
          echo "--- stopping diagnostic ---"
          pkill -9 -f "godot --headless" 2>/dev/null
          wait $BG || true
          exit 0

      - name: Partition test — empty Android project export
        timeout-minutes: 4
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          rm -rf /tmp/emptytest && mkdir -p /tmp/emptytest/build
          cd /tmp/emptytest
          printf 'config_version=5\n\n[application]\nconfig/name="EmptyTest"\nrun/main_scene="res://empty.tscn"\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > project.godot
          printf '[gd_scene format=3]\n\n[node name="Root" type="Node"]\n' > empty.tscn
          cp $GITHUB_WORKSPACE/export_presets.cfg .
          timeout 60 $GITHUB_WORKSPACE/godot --headless --verbose --export-android "Android" "build/empty.apk" > exp.log 2>&1
          echo "EMPTY_EXPORT_EXIT=$?"
          tail -25 exp.log
          echo "--- result ---"
          ls -la build/ 2>/dev/null || echo "NO APK for empty project"

      - name: Assert real APK exists
        run: |
          test -f build/unknown-haveli-debug.apk && echo "APK OK: $(ls -lh build/unknown-haveli-debug.apk | awk '{print $5}')" || { echo "FAIL: no APK produced"; exit 1; }

      - name: Print job timing summary
        run: |
          end=$(date +%s)
          start=$(cat /tmp/uh_start.txt)
          echo "Total job elapsed: $(( end - start )) seconds"
          echo "Per-step durations (Took X s) are shown next to each step in this log."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unknown-haveli-debug-apk
          path: build/unknown-haveli-debug.apk